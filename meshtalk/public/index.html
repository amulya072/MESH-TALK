<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeshTalk — direct, peer to peer</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- JOIN SCREEN -->
<section id="join-screen" class="screen">
  <div class="join-card">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <circle cx="8" cy="20" r="4" class="node-dot"/>
        <circle cx="32" cy="8" r="4" class="node-dot"/>
        <circle cx="32" cy="32" r="4" class="node-dot"/>
        <path d="M11 19 L29 9" class="node-link"/>
        <path d="M11 21 L29 31" class="node-link"/>
        <path d="M32 12 L32 28" class="node-link node-link-dim"/>
      </svg>
      <h1>MeshTalk</h1>
    </div>
    <p class="tagline">No server in the middle. Messages hop peer to peer, same idea as Bitchat &mdash; just carried over the internet instead of Bluetooth.</p>

    <label class="field-label" for="name-input">Your name</label>
    <input id="name-input" class="field" type="text" placeholder="e.g. Kestrel" maxlength="32" autocomplete="off">

    <label class="field-label" for="room-input">Room code</label>
    <div class="room-row">
      <input id="room-input" class="field" type="text" placeholder="e.g. rooftop-42" maxlength="64" autocomplete="off">
      <button id="new-room-btn" class="ghost-btn" type="button" title="Generate a new room code">New</button>
    </div>

    <button id="join-btn" class="primary-btn" type="button">Join mesh</button>
    <p id="join-error" class="error-text"></p>
  </div>
</section>

<!-- CHAT SCREEN -->
<section id="chat-screen" class="screen hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <svg class="brand-mark small" viewBox="0 0 40 40" fill="none">
        <circle cx="8" cy="20" r="4" class="node-dot"/>
        <circle cx="32" cy="8" r="4" class="node-dot"/>
        <circle cx="32" cy="32" r="4" class="node-dot"/>
        <path d="M11 19 L29 9" class="node-link"/>
        <path d="M11 21 L29 31" class="node-link"/>
        <path d="M32 12 L32 28" class="node-link node-link-dim"/>
      </svg>
      <div>
        <div class="room-title">MeshTalk</div>
        <div class="room-code" id="room-code-label">—</div>
      </div>
    </div>

    <button id="copy-link-btn" class="ghost-btn full-width" type="button">Copy invite link</button>

    <div class="mesh-graph-wrap">
      <div class="section-label">Mesh</div>
      <svg id="mesh-graph" viewBox="0 0 240 200"></svg>
    </div>

    <div class="section-label">Peers <span id="peer-count">(1)</span></div>
    <ul id="peer-list" class="peer-list"></ul>

    <div class="sidebar-footer">
      <span class="you-dot"></span> You are <strong id="my-name-label">—</strong>
    </div>
  </aside>

  <main class="chat-main">
    <div class="mobile-bar">
      <span class="mobile-room" id="room-code-mobile">—</span>
      <button id="copy-link-btn-mobile" class="ghost-btn" type="button">Copy invite link</button>
    </div>
    <div class="chat-log" id="chat-log"></div>
    <form id="composer" class="composer">
      <input id="msg-input" class="msg-input" type="text" placeholder="Message the mesh…" autocomplete="off" maxlength="2000">
      <button class="send-btn" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 11.5L21 3l-8.5 18-2.5-7.5L3 11.5z" fill="currentColor"/></svg>
      </button>
    </form>
  </main>
</section>

<script src="app.js"></script>
</body>
</html>
